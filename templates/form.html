<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detection App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff, #c3dafe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: white;
        }
        .btn-primary {
            background-color: #2563eb !important;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            transition: background-color 0.3s;
            display: block !important;
            visibility: visible !important;
        }
        .btn-primary:hover {
            background-color: #1e40af !important;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
        }
        .alert {
            border-radius: 10px;
            font-weight: 500;
        }
        .result {
            font-size: 1.2rem;
        }
        .d-grid {
            display: block !important;
        }
        h2 {
            color: #1e3a8a;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 class="text-center mb-4">📩 Spam Detection App</h2>
            <form action="/predict" method="post">
                <div class="mb-3">
                    <label for="message" class="form-label fw-bold">Enter your message:</label>
                    <textarea class="form-control" id="message" name="message" rows="5" placeholder="Type your message here..." required>{{ message | default('', true) }}</textarea>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Check Spam 🔍</button>
                </div>
            </form>
            {% if prediction %}
                <div class="mt-4 alert alert-{{ 'danger' if 'SPAM' in prediction else 'success' }}">
                    <span class="result">{{ prediction }}</span>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
